<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#7c3aed" stroke="#5b21b6" stroke-width="2"/>
  
  <!-- Bar chart representing reporting -->
  <rect x="7" y="18" width="3" height="8" fill="#ffffff" rx="0.5"/>
  <rect x="12" y="13" width="3" height="13" fill="#ffffff" rx="0.5"/>
  <rect x="17" y="10" width="3" height="16" fill="#ffffff" rx="0.5"/>
  <rect x="22" y="15" width="3" height="11" fill="#ffffff" rx="0.5"/>
  
  <!-- Trend line overlay -->
  <path d="M 7 20 L 13 15 L 18 12 L 23 16" 
        stroke="#c4b5fd" 
        stroke-width="1.5" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Data points on trend line -->
  <circle cx="7" cy="20" r="1.5" fill="#c4b5fd"/>
  <circle cx="13" cy="15" r="1.5" fill="#c4b5fd"/>
  <circle cx="18" cy="12" r="1.5" fill="#c4b5fd"/>
  <circle cx="23" cy="16" r="1.5" fill="#c4b5fd"/>
</svg>
